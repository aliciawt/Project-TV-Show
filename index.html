<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Show Project | Alicia Wynona Tjahjadi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <select id="show-dropdown">
      <option value="">Select a show...</option>
    </select>

    <select id="episode-dropdown">
      <option value="">All episodes</option>
    </select>

    <input type="text" id="search-box" placeholder="Search episodes...">
    <span id="number-of-episodes"></span>
  </header>

  <div id="card-container"></div>

  <!-- Template for episode card -->
  <template id="template">
    <div class="episode-card">
      <div class="episode-code"></div>
      <h2 class="title"></h2>
      <img class="image" />
      <div class="summary"></div>
    </div>
  </template>

  <footer>
    Data from <a href="https://www.tvmaze.com/" target="_blank">TVMaze.com</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
