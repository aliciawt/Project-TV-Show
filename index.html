<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Alicia Wynona Tjahjadi (aliciawt)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <aside id="live-search">
      <form>
        <input id="search-box" type="text" placeholder="Start typing to search..."/>
      </form>
      <p id="number-of-episodes"></p>
    </aside>

    <div id="card-container"></div>

    <template id="template">
      <div id="episode-card">
      <h2 class="title"></h2>
      <div class="episode-code"></div>
      <img class="image" />
      <p class="summary"></p>
    </div>
    </template>
    
    <script src="episodes.js"></script>

    <script src="script.js"></script>
  </body>

  <footer> Data originally from 
    <a href="https://www.tvmaze.com/" target="_blank" rel="noopener">TVMaze.com</a>
  </footer>

</html>
